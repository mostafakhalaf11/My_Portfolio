name: Test and deploy

# Every push and pull request runs the quality gates. Only main deploys, and only when they pass.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   Variable  AZURE_WEBAPP_NAME              the App Service name from infra/main.bicepparam
#   Secret    AZURE_WEBAPP_PUBLISH_PROFILE   output of:
#             az webapp deployment list-publishing-profiles -g rg-portfolio -n <app> --xml

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # matches linuxFxVersion in infra/app.bicep
          extensions: intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The Blade layout's @vite needs the manifest even in tests that only assert on HTML.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest (SQLite, the production engine)
        run: vendor/bin/pest

  deploy:
    name: Deploy to Azure App Service
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    concurrency:
      group: production
      cancel-in-progress: false # never cut a deployment off halfway
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # App Service does not build (SCM_DO_BUILD_DURING_DEPLOYMENT=false): ship vendor/ ready-made.
      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      # Secrets come from App Service settings, so no .env ships. Compiled views are left out
      # because startup.sh compiles them under the server's own paths.
      - name: Package release
        run: |
          zip -qr release.zip . \
            -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' 'infra/*' \
               '.env' '.env.*' 'public/hot' 'database/*.sqlite*' \
               'storage/framework/views/*.php' 'storage/logs/*.log'
          du -h release.zip

      # clean: true makes wwwroot an exact copy of the package. Without it, files deleted from the
      # repo survive on the server (a removed public/robots.txt kept shadowing its route).
      # Safe: the SQLite database lives in /home/data, outside wwwroot.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
          type: zip
          clean: true

      # The home page reads the database, so a 200 proves boot, migrations and seed all worked.
      # F1 cold-starts and runs startup.sh first, hence the generous retry window (~5 minutes).
      - name: Smoke test
        run: >
          curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors
          -o /dev/null -w "HTTP %{http_code}\n"
          "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/"
