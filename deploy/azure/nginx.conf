# Replaces /etc/nginx/sites-available/default in the App Service PHP 8.x Linux image
# (copied by startup.sh). The stock config serves /home/site/wwwroot itself; Laravel
# must be served from public/ so nothing above it (.env, storage, vendor) is reachable.
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot/public;
    index index.php;
    server_name _;
    port_in_redirect off;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output is content-hashed, so it can be cached for good. Fewer requests also means
    # less of F1's 60 CPU-minutes a day spent re-serving the same bundle.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    # Generated by Laravel (SeoController) so its Sitemap line follows the current host.
    location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

    # Hidden files (.git, .env copies) are never served; ACME challenges still work.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.[Pp][Hh][Pp])(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        # Let Laravel render its own error pages instead of nginx's generic 50x page.
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}
